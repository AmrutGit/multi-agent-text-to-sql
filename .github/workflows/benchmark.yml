name: Benchmark
# Manual only: it calls paid APIs, so it is deliberately NOT run on every push.
# Add API keys as repository secrets (ANTHROPIC_API_KEY, GOOGLE_API_KEY).
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated names from evals/models.yaml"
        default: "gemini-flash"
      n:
        description: "Number of BIRD questions"
        default: "50"

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache BIRD
        uses: actions/cache@v4
        with:
          path: data/bird_raw
          key: bird-dev-v1
      - run: python -m evals.fetch_bird
      - name: Retrieval/validator audit (no LLM)
        run: python -m evals.audit --dataset bird --data-dir data/bird_raw | tee audit.txt
      - name: Benchmark
        run: python -m evals.benchmark --dataset bird --data-dir data/bird_raw -n "${{ inputs.n }}" --models "${{ inputs.models }}"
      - name: Report
        run: python -m evals.report | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            evals/results/
            audit.txt
